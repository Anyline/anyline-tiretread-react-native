name: Publish to npm

on:
  release:
    types: [published]     # future releases: auto-publish when release-on-merge cuts the Release
  workflow_dispatch: {}     # manual path (needed for 15.3.0, whose release event already fired)

permissions:
  id-token: write           # required for npm Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anyline-tiretread-react-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11   # OIDC needs npm >= 11.5.1; pin to stable 11.x (Node 22 ships npm 10)

      - name: Install dependencies
        run: npm install             # no committed lockfile, so not `npm ci`

      - name: Publish (OIDC trusted publishing, no token)
        run: npm publish --access public
